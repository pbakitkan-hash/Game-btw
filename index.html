<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BrainrotFarm TMA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap');
:root{--bg:#0b0812;--panel:#171122;--panel2:#241a35;--text:#fff;--accent:#ff7300;--purple:#7a28cb;--green:#00ff88;--red:#ff3355;--gold:#ffd700;--line:#35264d}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:'Montserrat',sans-serif;background:var(--bg) radial-gradient(circle at top,#2d1b45 0%,var(--bg) 70%);color:var(--text);padding-bottom:30px;overflow-x:hidden;min-height:100vh}
.r0{--rc:#9aa3b2}.r1{--rc:#3b9cff}.r2{--rc:#a855f7}.r3{--rc:#ffb020}.r4{--rc:#ff3d6e}.r5{--rc:#00f0ff}.r6{--rc:#ff2bd6}.r7{--rc:#ffd700}
.bg{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.fl{position:absolute;opacity:.18;animation:up 12s linear infinite}
@keyframes up{0%{transform:translateY(105vh) rotate(0);opacity:0}50%{opacity:.35}100%{transform:translateY(-80px) rotate(360deg);opacity:0}}
.header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(23,17,34,.92);backdrop-filter:blur(8px);border-bottom:2px solid var(--purple);position:sticky;top:0;z-index:100}
.logo{font-weight:900;font-size:14px;background:linear-gradient(90deg,var(--green),var(--gold));-webkit-background-clip:text;color:transparent}
.bal{background:var(--panel2);padding:6px 6px 6px 12px;border-radius:20px;font-weight:800;color:var(--gold);display:flex;align-items:center;gap:6px;font-size:14px;border:1px solid var(--line)}
.bal b{background:var(--accent);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.icon-btn{background:var(--panel2);border:1px solid var(--line);color:#fff;width:36px;height:36px;border-radius:50%;font-size:17px}
.feed{background:linear-gradient(90deg,#171122,#28143c);border:1px solid var(--purple);border-radius:12px;margin:10px 14px;padding:10px;display:flex;align-items:center;gap:10px;overflow:hidden;min-height:44px}
.live{background:var(--red);font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;animation:pulse 1.5s infinite;flex-shrink:0}
@keyframes pulse{50%{opacity:.45}}
.feed-c{display:flex;align-items:center;gap:8px;font-size:12px;white-space:nowrap;overflow:hidden;width:100%;animation:slideIn .5s ease-out}
.feed-c span{font-weight:800;color:var(--rc,var(--accent))}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.tabs{display:flex;padding:4px 14px 10px;gap:8px}
.tab-btn{flex:1;padding:12px 4px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:#8b82a0;font-weight:800;font-size:11.5px;transition:.25s;font-family:inherit}
.tab-btn.active{background:linear-gradient(135deg,#ff9a00,#ff5e00);color:#fff;border-color:transparent;box-shadow:0 0 18px rgba(255,115,0,.45)}
.content-section{display:none}.content-section.active{display:block;animation:slideIn .3s}
/* cases */
.cases{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:6px 14px}
.case{--c:#7a28cb;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 38%,#171122),#120d1c 70%);border-radius:18px;padding:16px 10px 12px;text-align:center;border:1px solid color-mix(in srgb,var(--c) 70%,#000);position:relative;overflow:hidden;transition:.2s;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.case:active{transform:scale(.95)}
.case::before{content:"";position:absolute;top:-50%;left:-60%;width:40%;height:200%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);transform:rotate(20deg);animation:shine 4s infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:140%}}
.case-ico{font-size:58px;margin-bottom:8px;filter:drop-shadow(0 0 14px var(--c));animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(3deg)}}
.case-name{font-weight:900;font-size:13px;margin-bottom:6px}
.case-price{color:#fff;font-weight:800;font-size:12px;background:rgba(0,0,0,.45);padding:5px 12px;border-radius:12px;display:inline-block;border:1px solid var(--line)}
.case-tag{position:absolute;top:8px;right:8px;font-size:9px;font-weight:800;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.5);color:var(--rc)}
/* item card */
.item{width:100px;height:112px;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--rc) 35%,#171122),#120d1c 75%);border-radius:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:40px;border:1px solid color-mix(in srgb,var(--rc) 60%,#000);border-bottom:4px solid var(--rc);flex-shrink:0;position:relative}
.item i{font-style:normal;filter:drop-shadow(0 0 8px var(--rc))}
.item span{font-size:10px;font-weight:800;margin-top:5px;text-align:center;padding:0 4px;height:24px;overflow:hidden;line-height:12px}
.item.win{animation:winp .8s ease-out;box-shadow:0 0 28px var(--rc)}
@keyframes winp{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
/* inventory */
.inv-head{display:flex;justify-content:space-between;align-items:center;padding:4px 14px 8px;font-size:12px;color:#9a90b0;font-weight:700}
.inv{padding:6px 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.inv-item{background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--rc) 30%,#171122),#120d1c 75%);border-radius:12px;padding:10px 6px;text-align:center;border:1px solid color-mix(in srgb,var(--rc) 55%,#000);border-bottom:4px solid var(--rc);animation:pop .3s}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.inv-ico{font-size:32px;margin-bottom:4px;filter:drop-shadow(0 0 8px var(--rc))}
.inv-name{font-size:10px;font-weight:800;height:24px;overflow:hidden;display:flex;align-items:center;justify-content:center;line-height:12px}
.inv-rar{font-size:8px;font-weight:800;color:var(--rc);margin:2px 0}
.inv-price{color:var(--gold);font-size:10px;margin-bottom:6px;font-weight:800}
.sell-btn{background:var(--red);color:#fff;border:none;padding:6px;border-radius:7px;font-size:10px;width:100%;font-weight:800;font-family:inherit}
.empty{grid-column:span 3;text-align:center;color:#8b82a0;padding:30px 10px;font-size:14px}
.mini-btn{background:var(--panel2);border:1px solid var(--line);color:#fff;border-radius:10px;padding:6px 10px;font-size:11px;font-weight:800;font-family:inherit}
/* upgrader */
#upgrader-section{padding:14px;flex-direction:column;align-items:center}
@keyframes spin{100%{transform:rotate(270deg)}}
.up-circle.ok{animation:okf .8s}.up-circle.bad{animation:shake .5s}
@keyframes okf{50%{filter:drop-shadow(0 0 40px var(--green)) brightness(1.4)}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.up-chance{font-size:46px;font-weight:900;margin:14px 0 10px;text-shadow:0 0 16px rgba(0,255,136,.45)}.up-chance span{font-size:12px;color:#8b82a0;letter-spacing:2px}
.up-bar{position:relative;width:100%;height:48px;border-radius:14px;background:repeating-linear-gradient(90deg,#1d1430 0 10px,#241a35 10px 20px);border:2px solid var(--line);overflow:hidden;box-shadow:inset 0 0 18px #000}
.zone{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#00c46a,#00ff88);box-shadow:0 0 18px var(--green);transition:width .4s}
.ptr{position:absolute;top:0;bottom:0;left:0;width:6px;margin-left:-3px;background:#fff;border-radius:3px;box-shadow:0 0 14px #fff,0 0 28px var(--accent);z-index:2}
.up-scale{display:flex;justify-content:space-between;width:100%;font-size:10px;color:#6f6585;font-weight:800;margin:5px 2px 16px}
.case.wide{grid-column:span 2;display:flex;align-items:center;gap:16px;text-align:left;padding:14px 18px;animation:glow 2s infinite}
.case-ico img{width:68px;height:68px;object-fit:contain}.case.wide .case-ico{font-size:46px;margin:0}
@keyframes glow{50%{box-shadow:0 0 26px color-mix(in srgb,var(--c) 75%,transparent)}}
.inp{width:100%;padding:14px;border-radius:12px;border:1px solid var(--purple);background:var(--panel);color:#fff;font:800 16px Montserrat,sans-serif;text-align:center;-webkit-user-select:text;user-select:text;outline:none}
.item i img{width:62px;height:62px;object-fit:contain}.inv-ico img{width:50px;height:50px;object-fit:contain}.sel-ico img{width:72px;height:72px;object-fit:contain}.res-grid .item:first-child i img{width:84px;height:84px}
.road{position:relative;height:150px;border-radius:16px;overflow:hidden;background:#2b2b38;border:2px solid var(--line);margin:8px 0 12px}
.start{position:absolute;left:0;top:0;bottom:0;width:11.11%;background:#1f7a3c;display:flex;align-items:flex-end;justify-content:center;font-size:18px;padding-bottom:6px}
.lane{position:absolute;top:0;bottom:0;width:11.11%;border-left:2px dashed rgba(255,255,255,.22);overflow:hidden;text-align:center;transition:background .3s}
.lane .lm{position:absolute;bottom:4px;left:0;right:0;font-size:10px;font-weight:900;color:var(--gold)}
.lane.done{background:rgba(0,255,136,.15)}
.car{position:absolute;left:50%;top:-30px;font-size:24px;font-style:normal;transform:translateX(-50%) rotate(-90deg);animation:drive 2s linear infinite}
@keyframes drive{to{top:165px}}
.lane.hit .car{animation:hitcar .45s ease-in forwards}
@keyframes hitcar{from{top:-30px}to{top:50px}}
.cow{position:absolute;top:46px;left:0;width:11.11%;text-align:center;font-size:28px;transition:left .4s;z-index:3}
.cow-info{text-align:center;font-size:26px;font-weight:900;color:var(--gold);margin-bottom:10px;text-shadow:0 0 14px rgba(255,215,0,.4)}
.mults{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.mult-btn{background:var(--panel);border:1px solid var(--line);color:#fff;padding:12px 4px;border-radius:10px;font-weight:800;font-size:14px;font-family:inherit}
.mult-btn.active{border-color:var(--green);color:var(--green);box-shadow:0 0 10px rgba(0,255,136,.35)}
.sel{width:100%;background:var(--panel);border:1px dashed var(--purple);border-radius:15px;padding:15px;display:flex;flex-direction:column;align-items:center;margin-top:18px;min-height:110px;justify-content:center}
.sel.has{border:1px solid var(--rc);background:radial-gradient(circle,color-mix(in srgb,var(--rc) 22%,#171122),#171122)}
.sel-ico{font-size:45px;margin-bottom:5px;filter:drop-shadow(0 0 10px var(--rc))}
.btn{padding:15px;border-radius:14px;border:none;font-weight:900;font-size:15px;transition:.2s;text-transform:uppercase;width:100%;margin-top:14px;font-family:inherit;color:#fff}
.btn-p{background:linear-gradient(135deg,#ff9a00,#ff5e00);box-shadow:0 4px 18px rgba(255,115,0,.45)}
.btn-g{background:linear-gradient(135deg,#00c46a,#00ff88);color:#042;box-shadow:0 4px 18px rgba(0,255,136,.3)}
.btn-d{background:#3a2f4d}
.btn:active{transform:scale(.96)}
/* modals */
.modal{position:fixed;inset:0;background:rgba(5,3,10,.95);z-index:1000;display:none;flex-direction:column;align-items:center;backdrop-filter:blur(6px);overflow-y:auto;padding:14px 0 30px}
.modal.active{display:flex}
.modal.shake{animation:shake .5s}
.m-head{display:flex;width:92%;justify-content:space-between;align-items:center;margin-bottom:10px}
.m-head h2{font-size:16px;text-transform:uppercase;font-weight:900}
.ctrls{display:flex;flex-direction:column;width:92%;gap:8px;margin-bottom:12px}
.row{display:flex;background:var(--panel);border-radius:14px;padding:4px;border:1px solid var(--line)}
.ctrl{flex:1;background:transparent;border:none;color:#8b82a0;padding:10px;border-radius:11px;font-weight:800;font-size:13px;font-family:inherit}
.ctrl.active{background:var(--accent);color:#fff}
.roller-wrap{width:100%;height:140px;background:#07040b;border-top:2px solid var(--purple);border-bottom:2px solid var(--purple);position:relative;overflow:hidden;margin:6px 0 14px;flex-shrink:0}
.roller-line{position:absolute;left:50%;top:0;bottom:0;width:4px;background:var(--accent);transform:translateX(-50%);z-index:10;box-shadow:0 0 16px var(--accent)}
.roller-wrap::before,.roller-wrap::after{content:"";position:absolute;top:0;bottom:0;width:60px;z-index:9}
.roller-wrap::before{left:0;background:linear-gradient(90deg,#07040b,transparent)}.roller-wrap::after{right:0;background:linear-gradient(-90deg,#07040b,transparent)}
.roller{display:flex;position:absolute;left:0;top:14px;gap:10px;will-change:transform}
.res{display:none;flex-direction:column;align-items:center;width:92%;gap:10px}
.res.show{display:flex;animation:slideIn .4s}
.res-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.res-grid .item:first-child{width:130px;height:140px;font-size:50px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:92%}
.cf{position:fixed;top:45%;left:50%;font-size:22px;pointer-events:none;z-index:2000;animation:cf 1.3s ease-out forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#2a1f38;border:1px solid var(--purple);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;z-index:3000;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="bg" id="bg"></div>

<div class="header">
  <div class="logo">🌿 BRAINROT FARM</div>
  <div style="display:flex;gap:10px;align-items:center">
    <div class="bal" onclick="openPromo()">🪙 <span id="bal">0</span><b>+</b></div>
    <button class="icon-btn" onclick="openPromo()">🎟️</button>
  </div>
</div>

<div class="feed"><div class="live">● LIVE</div>
  <div class="feed-c" id="feed"><span style="color:#8b82a0">Очікування сервера...</span></div>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('cases',this)">Кейси</button>
  <button class="tab-btn" onclick="switchTab('upgrader',this)">Апгрейдер</button>
  <button class="tab-btn" onclick="switchTab('inventory',this)">Інвентар</button>
  <button class="tab-btn" onclick="switchTab('cow',this)">🐄 Корова</button>
</div>

<div id="cases-section" class="content-section active"><div class="cases" id="cases"></div></div>

<div id="upgrader-section" class="content-section">
  <div class="up-chance" id="chance">0% <span>ШАНС</span></div>
  <div class="up-circle up-bar" id="up-circle"><div class="zone" id="zone"></div><div class="ptr" id="ptr"></div></div>
  <div class="up-scale"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div>
  <div class="mults">
    <button class="mult-btn" onclick="setUpgradeChance(75,this)">75%</button>
    <button class="mult-btn" onclick="setUpgradeChance(60,this)">60%</button>
    <button class="mult-btn" onclick="setUpgradeChance(40,this)">40%</button>
    <button class="mult-btn" onclick="setUpgradeChance(20,this)">20%</button>
    <button class="mult-btn" onclick="setUpgradeChance(10,this)">10%</button>
    <button class="mult-btn" onclick="setUpgradeChance(5,this)">5%</button>
    <button class="mult-btn" onclick="setUpgradeChance(2,this)">2%</button>
    <button class="mult-btn" onclick="setUpgradeChance(1,this)">1%</button>
  </div>
  <div class="sel" id="sel" onclick="openInventoryForUpgrade()"><div style="font-size:12px;color:#8b82a0;text-align:center">ТАПНИ, ЩОБ ОБРАТИ ПЕТА<br>З ІНВЕНТАРЮ</div></div>
  <button class="btn btn-p" onclick="doUpgrade()">ПРОКАЧАТИ</button>
</div>

<div id="inventory-section" class="content-section">
  <div class="inv-head"><div id="inv-info"></div><button class="mini-btn" onclick="sellAll()">Продати все</button></div>
  <div class="inv" id="inv"></div>
</div>

<div id="cow-section" class="content-section">
  <div style="padding:0 14px">
    <div class="road" id="road"><div class="start">🌿</div><div class="cow" id="cow">🐄</div></div>
    <div class="cow-info" id="cow-info">x1</div>
    <div id="bet-box">
      <div class="row"><button class="ctrl active" id="bt-coin" onclick="setBetType('coin')">🪙 Монети</button><button class="ctrl" id="bt-pet" onclick="setBetType('pet')">🧠 Брейнрот</button></div>
      <div id="bet-coin" style="margin-top:10px">
        <input id="bet-amt" class="inp" type="number" value="10" inputmode="numeric">
        <div class="row" style="margin-top:8px"><button class="ctrl" onclick="setBet(10)">10</button><button class="ctrl" onclick="setBet(50)">50</button><button class="ctrl" onclick="setBet(100)">100</button><button class="ctrl" onclick="setBet('max')">MAX</button></div>
      </div>
      <div id="bet-pet" class="sel" style="display:none" onclick="pickBetPet()"></div>
    </div>
    <button class="btn btn-p" id="cow-start" onclick="cowStart()">СТАРТ</button>
    <button class="btn btn-p" id="cow-go" style="display:none" onclick="cowGo()"></button>
    <button class="btn btn-g" id="cow-cash" style="display:none" onclick="cowCash()"></button>
    <div style="font-size:11px;color:#8b82a0;text-align:center;margin-top:12px">Кожен крок вдвічі збільшує множитель (x2, x4, x8…), але корову може збити машина. Забери виграш вчасно!</div>
  </div>
</div>

<!-- Case modal -->
<div class="modal" id="case-modal">
  <div class="m-head"><h2 id="m-name"></h2><button class="icon-btn" onclick="closeCase()">✕</button></div>
  <div class="ctrls" id="ctrls">
    <div class="row" id="mult-row">
      <button class="ctrl active" onclick="selectMultiplier(1,this)">x1</button>
      <button class="ctrl" onclick="selectMultiplier(3,this)">x3</button>
      <button class="ctrl" onclick="selectMultiplier(5,this)">x5</button>
    </div>
    <div class="row">
      <button class="ctrl active" id="sp-slow" onclick="toggleSpeed('slow')">⏳ Повільно</button>
      <button class="ctrl" id="sp-fast" onclick="toggleSpeed('fast')">⏩ Швидко</button>
    </div>
  </div>
  <div class="roller-wrap"><div class="roller-line"></div><div class="roller" id="roller"></div></div>
  <button class="btn btn-p" id="open-btn" style="width:92%" onclick="startOpen()"></button>
  <button class="btn btn-d" id="skip-btn" style="width:92%;display:none" onclick="skipAnimation()">ПРОПУСТИТИ</button>
  <div class="res" id="res">
    <div style="font-size:13px;color:#8b82a0;font-weight:800">ТОБІ ВИПАЛО:</div>
    <div class="res-grid" id="res-grid"></div>
    <div style="display:flex;gap:10px;width:100%">
      <button class="btn btn-d" style="margin:0" onclick="sellWon()">ПРОДАТИ</button>
      <button class="btn btn-p" style="margin:0" onclick="again()">ЩЕ РАЗ</button>
    </div>
  </div>
</div>

<!-- Upgrade picker -->
<div class="modal" id="pick-modal">
  <div class="m-head"><h2>Обери пета</h2><button class="icon-btn" onclick="closePick()">✕</button></div>
  <div class="pgrid" id="pgrid"></div>
</div>
<div class="modal" id="promo-modal">
  <div class="m-head"><h2>🎟️ Промокод</h2><button class="icon-btn" onclick="closePromo()">✕</button></div>
  <div style="width:92%;display:flex;flex-direction:column;gap:10px">
    <input id="promo-in" class="inp" placeholder="Введи промокод" autocomplete="off" autocapitalize="off">
    <button class="btn btn-g" style="margin:0" onclick="applyPromo()">АКТИВУВАТИ</button>
    <div style="font-size:11px;color:#8b82a0;text-align:center">Підтримка: @BrainrotFarmSupport</div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
try { tg && (tg.expand(), tg.ready()); } catch(e){}
const H = (t,k) => { try { tg.HapticFeedback[t](k); } catch(e){} };
const $ = id => document.getElementById(id);

// ---------- DATA ----------
const RN = ['Common','Rare','Epic','Legendary','Mythic','Brainrot God','Secret','OG'];
const BASE = [50,28,12,6,3,.8,.2,.05];
// [name, icon, value, rarity]
const POOL = [
 ['Secret Lucky Block','📦',13,0],['Tung Tung Sahur','🪵',5,0],['Burguro and Fryuro','🍔',104,1],['Tirilikalika Tirilikalako','🐓',1020,3],['La Supreme Combinasion','🎩',2000,3],['Headless Horseman','🎃',140000,7],['Trippi Troppi','🦐',30,0],['Bandito Bobritto','🦫',55,0],['Gangster Footera','🦶',65,1],['Ketupat Kepat','🍃',22,0],['Garama & Madundung','🗿',45,0],

// ваги підбираються так, щоб середній виграш ≈ 90% від ціни кейса (інакше можна фармити нескінченно)
function buildWeights(c) {
  const ok = i => !i.no && i.r >= (c.rmin || 0) && i.r <= (c.rmax === undefined ? 7 : c.rmax) && (!c.f || c.f(i));
  const target = c.free ? 45 : c.price * .9;
  const ev = a => { let s = 0, t = 0; POOL.forEach(i => { if (ok(i)) { const w = Math.pow(i.val, -a); s += w * i.val; t += w; } }); return s / t; };
  let lo = -3, hi = 4;
  for (let n = 0; n < 60; n++) { const m = (lo + hi) / 2; if (ev(m) > target) lo = m; else hi = m; }
  c.w = POOL.map(i => ok(i) ? Math.pow(i.val, -(lo + hi) / 2) : 0);
  let tot = c.w.reduce((a, b) => a + b, 0); let top = 0;
  if (c.fixed) POOL.forEach((i, n) => { const q = c.fixed[i.name]; if (q) c.w[n] = q / (1 - q) * tot; }); // точний шанс дропу (0.003% = 0.00003)
  POOL.forEach((i, n) => { if (c.w[n] / tot >= .005) top = Math.max(top, i.r); });
  c.tag = c.free ? '1 раз / день' : c.id === 'allornothing' ? '💀 x або 0' : c.fixed ? '👻 0.003%' : 'до ' + RN[top];
}
CASES.forEach(buildWeights);

const slug = n => n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const ico = it => IMGS[slug(it.name)] ? `<img src="${IMGS[slug(it.name)]}" alt="">` : it.icon;
const caseIco = c => c.img && IMGS[c.img] ? `<img src="${IMGS[c.img]}" alt="">` : c.icon;
const itemHTML = (it, cls='') => `<div class="item r${it.r} ${cls}"><i>${ico(it)}</i><span>${it.name}</span></div>`;

function pick(c) {
  const w = c.w; let x = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < POOL.length; i++) { x -= w[i]; if (w[i] > 0 && x <= 0) return POOL[i]; }
  return POOL[POOL.length - 1];
}
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('show'), 2200); }
function updateBalance() { if (infinite) balance = INF_BAL; $('bal').textContent = infinite ? '∞' : fmt(balance); save(); }

// bg
(() => { const e = ['🎃','🦇','👻','🕷️','💀','🦈','🐘','🚽']; for (let i = 0; i < 18; i++) { const d = document.createElement('div'); d.className = 'fl'; d.textContent = e[i % e.length]; d.style.cssText = `left:${Math.random()*100}vw;font-size:${15+Math.random()*20}px;animation-duration:${6+Math.random()*8}s;animation-delay:${Math.random()*5}s`; $('bg').appendChild(d); } })();

function switchTab(id, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
  btn.classList.add('active'); $(id + '-section').classList.add('active');
  if (id === 'inventory') renderInventory();
  H('impactOccurred','light');
}

// ---------- LIVE FEED (сервер) ----------
// Если игра открыта с GitHub Pages — API берём с Render. ВПИШИ СВОЙ АДРЕС СЕРВИСА:
const RENDER_URL = 'https://ИМЯ-СЕРВИСА.onrender.com';
const SERVER_URL = location.hostname.endsWith('github.io') ? RENDER_URL + '/api' : '/api';
const esc = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showFeed(user, name, icon, r) {
  const c = $('feed'); c.style.animation = 'none'; c.offsetHeight; c.style.animation = '';
  c.innerHTML = `<div style="font-size:18px">👤</div><div class="r${+r||0}"><b>${esc(user)}</b> вибив <span>${esc(name)}</span></div><div style="font-size:20px">${esc(icon)}</div>`;
}
async function fetchLiveDrops() {
  try {
    const r = await fetch(`${SERVER_URL}/last-drops`); if (!r.ok) throw 0;
    const d = await r.json();
    if (d && d.length) { const x = d[0]; const it = POOL.find(p => p.name === x.itemName); showFeed(x.username, x.itemName, x.itemIcon, it ? it.r : 0); }
  } catch(e) { if ($('feed').textContent.includes('Очікування')) $('feed').innerHTML = '<div style="color:var(--red);font-size:12px;font-weight:600">⚠️ Немає зв\'язку з сервером (показую твої дропи)</div>'; }
}
async function sendDropToServer(it) {
  const user = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) || 'Гравець';
  showFeed(user, it.name, it.icon, it.r);
  try { await fetch(`${SERVER_URL}/drop`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username:user,itemName:it.name,itemIcon:it.icon,value:it.val})}); } catch(e){}
}
setInterval(fetchLiveDrops, 5000); fetchLiveDrops();

function openPromo() { H('impactOccurred','medium'); $('promo-in').value = ''; $('promo-modal').classList.add('active'); }
function closePromo() { $('promo-modal').classList.remove('active'); }
function applyPromo() {
  const code = $('promo-in').value.trim().toLowerCase(); if (!code) return;
  if (code === INF_CODE) {
    if (infinite) { toast('Безліміт вже активовано'); return; }
    infinite = true; updateBalance(); closePromo(); toast('♾️ Безліміт монет активовано!'); H('notificationOccurred','success'); confetti(30, 3); return;
  }
  if (!(code in PROMOS)) { toast('❌ Невірний промокод'); H('notificationOccurred','error'); return; }
  if (usedPromos.includes(code)) { toast('Цей промокод вже активовано'); return; }
  usedPromos.push(code); balance += PROMOS[code]; updateBalance(); closePromo();
  toast(`✅ +${fmt(PROMOS[code])} 🪙`); H('notificationOccurred','success'); confetti(20, 3);
}

// ---------- CASES ----------
function renderCases() {
  const el = $('cases'); el.innerHTML = '';
  [...CASES].sort((a,b) => (b.free?1:0) - (a.free?1:0) || a.price - b.price).forEach(c => {
    const d = document.createElement('div'); d.className = 'case' + (c.free ? ' wide' : ''); d.style.setProperty('--c', c.c); d.onclick = () => openCase(c);
    d.innerHTML = c.free
      ? `<div class="case-ico">${caseIco(c)}</div><div><div class="case-name">${c.name}</div><div class="case-price" id="free-t">...</div></div>`
      : `<div class="case-tag">${c.tag}</div><div class="case-ico">${caseIco(c)}</div><div class="case-name">${c.name}</div><div class="case-price">${fmt(c.price)} 🪙</div>`;
    el.appendChild(d);
  });
  updateFreeUI();
}
function updateFreeUI() {
  const l = freeLeft(), e = $('free-t'); if (e) e.textContent = l ? '⏳ ' + fmtT(l) : '✅ ДОСТУПНИЙ!';
  if (curCase && curCase.free && !rolling && $('case-modal').classList.contains('active') && !$('open-btn').style.display.includes('none')) updateOpenBtn();
}
setInterval(updateFreeUI, 1000);

let curCase = null, mult = 1, fast = false, rolling = false, rollTimer = null, pending = null, wonUids = [];
const WIN = 50, STEP = 110;

function selectMultiplier(m, btn) {
  if (rolling) return; mult = m;
  document.querySelectorAll('#mult-row .ctrl').forEach(b => b.classList.remove('active')); btn.classList.add('active');
  updateOpenBtn(); H('selectionChanged');
}
function toggleSpeed(m) { fast = m === 'fast'; $('sp-slow').classList.toggle('active', !fast); $('sp-fast').classList.toggle('active', fast); }
function updateOpenBtn() {
  const b = $('open-btn');
  if (curCase.free) { const l = freeLeft(); b.textContent = l ? `ДОСТУПНО ЧЕРЕЗ ${fmtT(l)}` : 'ВІДКРИТИ БЕЗКОШТОВНО'; b.disabled = !!l; b.style.opacity = l ? .5 : 1; }
  else { b.disabled = false; b.style.opacity = 1; b.textContent = `ВІДКРИТИ ЗА ${fmt(curCase.price * mult)} 🪙`; }
}

function fillRoller(winItem) {
  const r = $('roller'); r.style.transition = 'none'; r.style.transform = 'translateX(0)'; r.innerHTML = '';
  for (let i = 0; i < 60; i++) r.insertAdjacentHTML('beforeend', itemHTML(winItem && i === WIN ? winItem : pick(curCase)));
}
function openCase(c) {
  curCase = c; mult = 1; rolling = false; pending = null; $('mult-row').style.display = c.free ? 'none' : 'flex';
  document.querySelectorAll('#mult-row .ctrl').forEach((b,i) => b.classList.toggle('active', i === 0));
  $('m-name').textContent = c.name;
  resetModalUI(); fillRoller(null); updateOpenBtn();
  $('case-modal').classList.add('active'); H('impactOccurred','light');
}
function resetModalUI() {
  $('res').classList.remove('show'); $('ctrls').style.display = 'flex';
  $('open-btn').style.display = 'block'; $('skip-btn').style.display = 'none';
}
function again() { resetModalUI(); fillRoller(null); updateOpenBtn(); }

function startOpen() {
  if (rolling) return;
  if (curCase.free && freeLeft()) return;
  const cost = curCase.price * mult;
  if (balance < cost) { toast('Недостатньо коштів! Тапни на баланс.'); H('notificationOccurred','error'); return; }
  balance -= cost; if (curCase.free) freeAt = Date.now(); updateBalance();
  // РЕЗУЛЬТАТ ВИЗНАЧАЄТЬСЯ ТУТ І ТІЛЬКИ ТУТ — рулетка просто показує його
  const wins = Array.from({length: mult}, () => mk(pick(curCase)));
  pending = wins; rolling = true;
  $('ctrls').style.display = 'none'; $('open-btn').style.display = 'none'; $('skip-btn').style.display = 'block'; $('res').classList.remove('show');
  fillRoller(wins[0]);
  const r = $('roller'), dur = fast ? 700 : 5000;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    // позиція рахується від реальної ширини екрана → стрілка точно на виграшному предметі
    r.style.transition = `transform ${dur}ms cubic-bezier(.1,.7,.1,1)`;
    r.style.transform = `translateX(${landX((Math.random() - .5) * 70)}px)`;
  }));
  rollTimer = setTimeout(() => finishRoll(), dur + 100);
}
function landX(off) { return -(WIN * STEP + 50 - $('roller').parentElement.offsetWidth / 2 + off); }
function skipAnimation() {
  if (!rolling) return; clearTimeout(rollTimer);
  const r = $('roller'); r.style.transition = 'none'; r.style.transform = `translateX(${landX(0)}px)`;
  finishRoll();
}
function finishRoll() {
  if (!rolling || !pending) return; rolling = false;
  const wins = pending; pending = null;
  wins.forEach(w => inventory.push(w)); wonUids = wins.map(w => w.uid); save();
  $('roller').children[WIN].classList.add('win');
  $('skip-btn').style.display = 'none';
  $('res-grid').innerHTML = wins.map(w => itemHTML(w)).join('');
  $('res').classList.add('show');
  sendDropToServer(wins[0]);
  const best = Math.max(...wins.map(w => w.r));
  H('notificationOccurred','success');
  if (best >= 3) confetti(best * 6 + 10, best);
  if (best >= 5) { const m = $('case-modal'); m.classList.add('shake'); setTimeout(() => m.classList.remove('shake'), 600); }
  renderInventory();
}
function sellWon() {
  let sum = 0;
  inventory = inventory.filter(i => { if (wonUids.includes(i.uid)) { sum += i.val; return false; } return true; });
  balance += sum; wonUids = []; updateBalance(); renderInventory(); toast(`Продано за ${fmt(sum)} 🪙`); H('notificationOccurred','success');
  closeCase();
}
function closeCase() {
  if (rolling) { skipAnimation(); }
  $('case-modal').classList.remove('active');
}
function confetti(n, r) {
  const em = ['✨','🪙','⭐','🎉','💥'];
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div'); d.className = 'cf'; d.textContent = em[i % em.length];
    d.style.setProperty('--dx', (Math.random() - .5) * 600 + 'px'); d.style.setProperty('--dy', (Math.random() - .8) * 500 + 'px');
    document.body.appendChild(d); setTimeout(() => d.remove(), 1400);
  }
}

// ---------- INVENTORY ----------
function invCard(it, extra) {
  return `<div class="inv-item r${it.r}" ${extra || ''}><div class="inv-ico">${ico(it)}</div><div class="inv-name">${it.name}</div><div class="inv-rar">${RN[it.r]}</div><div class="inv-price">${fmt(it.val)} 🪙</div>`;
}
function renderInventory() {
  const c = $('inv'); c.innerHTML = '';
  $('inv-info').textContent = `${inventory.length} шт. · ${fmt(inventory.reduce((a,i) => a + i.val, 0))} 🪙`;
  if (!inventory.length) { c.innerHTML = '<div class="empty">Твій інвентар порожній.<br>Відкрий кейси, щоб отримати брейнротів!</div>'; return; }
  [...inventory].sort((a,b) => b.val - a.val).forEach(it => { c.insertAdjacentHTML('beforeend', invCard(it) + `<button class="sell-btn" onclick="sellItem('${it.uid}')">ПРОДАТИ</button></div>`); });
}
function sellItem(uid) {
  const i = inventory.findIndex(x => x.uid === uid); if (i < 0) return;
  balance += inventory[i].val; inventory.splice(i, 1);
  if (selectedUid === uid) clearSelected();
  updateBalance(); renderInventory(); H('notificationOccurred','success');
}
function sellAll() {
  if (!inventory.length) return;
  balance += inventory.reduce((a,i) => a + i.val, 0); inventory = []; clearSelected(); updateBalance(); renderInventory(); toast('Все продано'); 
}

// ---------- UPGRADER ----------
let currentChance = 0, selectedUid = null;
function setUpgradeChance(p, btn) {
  if ($('up-circle').classList.contains('spinning')) return;
  currentChance = p; $('chance').innerHTML = `${p}% <span>ШАНС</span>`;
  $('zone').style.width = p + '%';
  document.querySelectorAll('.mult-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active');
  H('selectionChanged');
}
function clearSelected() { selectedUid = null; const a = $('sel'); a.className = 'sel'; a.innerHTML = '<div style="font-size:12px;color:#8b82a0;text-align:center">ТАПНИ, ЩОБ ОБРАТИ ПЕТА<br>З ІНВЕНТАРЮ</div>'; }
function showSelected(it, extra) {
  const a = $('sel'); a.className = `sel has r${it.r}`;
  a.innerHTML = `<div class="sel-ico">${ico(it)}</div><div style="font-weight:800;font-size:14px">${it.name}</div>${extra || `<div style="color:var(--gold);font-size:12px;margin-top:4px">Вартість: ${fmt(it.val)} 🪙</div>`}`;
}
let pickMode = 'up', betUid = null;
function openInventoryForUpgrade() {
  if ($('up-circle').classList.contains('spinning')) return;
  openPicker('up');
}
function openPicker(mode) {
  if (!inventory.length) { toast('У тебе немає брейнротів!'); return; }
  pickMode = mode;
  const g = $('pgrid'); g.innerHTML = '';
  [...inventory].sort((a,b) => b.val - a.val).forEach(it => g.insertAdjacentHTML('beforeend', invCard(it, `onclick="pickUp('${it.uid}')"`) + '</div>'));
  $('pick-modal').classList.add('active');
}
function closePick() { $('pick-modal').classList.remove('active'); }
function pickUp(uid) {
  const it = inventory.find(i => i.uid === uid); if (!it) return;
  if (pickMode === 'bet') { betUid = uid; showBet(it); closePick(); return; }
  selectedUid = uid; showSelected(it); closePick(); H('selectionChanged');
}
function doUpgrade() {
  if (currentChance === 0) { toast('Спочатку обери шанс!'); return; }
  const idx = inventory.findIndex(i => i.uid === selectedUid);
  if (idx < 0) { toast('Спочатку обери пета для апгрейду!'); return; }
  const uc = $('up-circle'); if (uc.classList.contains('spinning')) return;
  const item = inventory[idx]; uc.classList.add('spinning'); H('impactOccurred','medium');
  const roll = Math.random() * 100, ptr = $('ptr');
  ptr.getAnimations().forEach(a => a.cancel());
  ptr.animate([{left:'0%'},{left:'100%'},{left:'0%'},{left:'100%'},{left:roll + '%'}], {duration: 2400, easing: 'cubic-bezier(.25,.6,.2,1)', fill: 'forwards'});
  setTimeout(() => {
    uc.classList.remove('spinning');
    const win = roll <= currentChance;
    const cur = inventory.findIndex(i => i.uid === item.uid);
    if (win && cur >= 0) {
      const m = Math.floor(100 / currentChance), nv = Math.floor(item.val * m);
      inventory[cur].val = nv; save();
      uc.classList.add('ok'); setTimeout(() => uc.classList.remove('ok'), 900);
      H('notificationOccurred','success'); confetti(24, 3); renderInventory();
      showSelected(inventory[cur], `<div style="font-weight:900;color:var(--green)">УСПІХ! x${m}</div><div style="color:var(--gold);font-size:12px">Нова ціна: ${fmt(nv)} 🪙</div>`);
    } else {
      if (cur >= 0) inventory.splice(cur, 1); save();
      uc.classList.add('bad'); setTimeout(() => uc.classList.remove('bad'), 600);
      H('notificationOccurred','error'); renderInventory(); clearSelected();
      $('sel').innerHTML = '<div style="font-size:14px;color:var(--red);text-align:center;font-weight:800">ПРОВАЛ!<br>Пет згорів. 🔥</div>';
    }
  }, 2450);
}

// ---------- КОРОВА ----------
const COW_P = .46, LANES = 8; // шанс вижити на кожному кроці (множитель x2 за крок → ~92% RTP)
let betType = 'coin', cow = {on: false, step: 0, bet: 0, busy: false};
const mulOf = n => Math.pow(2, n);
function buildRoad() {
  const r = $('road'); r.querySelectorAll('.lane').forEach(e => e.remove());
  const cars = ['🚗','🚕','🚙','🚚','🏎️'];
  for (let i = 0; i < LANES; i++) r.insertAdjacentHTML('beforeend', `<div class="lane" style="left:${(i + 1) * 100 / 9}%"><i class="car" style="animation-duration:${1.3 + Math.random() * 1.7}s;animation-delay:-${Math.random() * 2}s">${cars[i % 5]}</i><span class="lm">x${mulOf(i + 1)}</span></div>`);
}
function resetBetPet() { const a = $('bet-pet'); a.className = 'sel'; a.innerHTML = '<div style="font-size:12px;color:#8b82a0;text-align:center">ТАПНИ, ЩОБ ОБРАТИ БРЕЙНРОТА<br>ДЛЯ СТАВКИ</div>'; }
function showBet(it) { const a = $('bet-pet'); a.className = `sel has r${it.r}`; a.innerHTML = `<div class="sel-ico">${ico(it)}</div><div style="font-weight:800;font-size:13px">${it.name}</div><div style="color:var(--gold);font-size:12px;margin-top:3px">Ставка: ${fmt(it.val)} 🪙</div>`; }
function setBetType(t) {
  if (cow.on) return; betType = t;
  $('bt-coin').classList.toggle('active', t === 'coin'); $('bt-pet').classList.toggle('active', t === 'pet');
  $('bet-coin').style.display = t === 'coin' ? 'block' : 'none'; $('bet-pet').style.display = t === 'pet' ? 'flex' : 'none';
}
function setBet(n) { $('bet-amt').value = n === 'max' ? balance : n; }
function pickBetPet() { if (!cow.on) openPicker('bet'); }
function cowRender() {
  $('cow').style.left = (cow.step * 100 / 9) + '%';
  $('cow-info').textContent = cow.on ? `x${mulOf(cow.step)}` : 'x1';
  $('cow-go').textContent = `ЙТИ ДАЛІ → x${mulOf(cow.step + 1)}`;
  $('cow-cash').textContent = `ЗАБРАТИ ${fmt(cow.bet * mulOf(cow.step))} 🪙`;
  $('cow-cash').disabled = cow.step === 0; $('cow-cash').style.opacity = cow.step === 0 ? .5 : 1;
  document.querySelectorAll('#road .lane').forEach((l, i) => l.classList.toggle('done', i < cow.step));
}
function cowUI(on) {
  $('bet-box').style.display = on ? 'none' : 'block'; $('cow-start').style.display = on ? 'none' : 'block';
  $('cow-go').style.display = on ? 'block' : 'none'; $('cow-cash').style.display = on ? 'block' : 'none';
}
function cowStart() {
  if (cow.on || cow.busy) return; let val;
  if (betType === 'coin') {
    val = Math.floor(+$('bet-amt').value);
    if (!(val > 0)) { toast('Введи ставку'); return; }
    if (val > balance) { toast('Недостатньо монет'); return; }
    balance -= val; updateBalance();
  } else {
    const i = inventory.findIndex(x => x.uid === betUid);
    if (i < 0) { toast('Обери брейнрота для ставки'); return; }
    val = inventory[i].val; inventory.splice(i, 1); betUid = null; resetBetPet(); save(); renderInventory();
  }
  cow = {on: true, step: 0, bet: val, busy: false}; buildRoad(); cowUI(true); cowRender(); H('impactOccurred','medium');
}
function cowGo() {
  if (!cow.on || cow.busy) return; cow.busy = true; H('impactOccurred','light');
  const ok = Math.random() < COW_P, lane = cow.step;
  cow.step++; $('cow').style.left = (cow.step * 100 / 9) + '%';
  setTimeout(() => {
    if (ok) { cow.busy = false; cowRender(); H('selectionChanged'); if (cow.step >= LANES) cowCash(); return; }
    document.querySelectorAll('#road .lane')[lane].classList.add('hit');
    setTimeout(() => {
      $('cow').textContent = '💥'; H('notificationOccurred','error'); toast(`Корову збила машина! −${fmt(cow.bet)} 🪙`);
      cow.on = false; cowUI(false);
      setTimeout(() => { $('cow').textContent = '🐄'; cow.step = 0; cow.busy = false; buildRoad(); cowRender(); }, 1300);
    }, 450);
  }, 450);
}
function cowCash() {
  if (!cow.on || cow.step === 0) return;
  const pay = cow.bet * mulOf(cow.step); balance += pay; updateBalance();
  toast(`✅ Забрав ${fmt(pay)} 🪙 (x${mulOf(cow.step)})`); H('notificationOccurred','success'); confetti(22, 3);
  cow.on = false; cow.step = 0; cow.busy = false; cowUI(false); buildRoad(); cowRender();
}
buildRoad(); resetBetPet(); cowRender();
renderCases(); updateBalance(); renderInventory();
</script>
